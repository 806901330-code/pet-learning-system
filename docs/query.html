<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的宠物 - 查询</title>
  <style>
    /* ========== CSS 变量 — 红/蓝双主题 ========== */
    :root {
      --color-bg-from: #8B1A1A;
      --color-bg-to: #C41E1E;
      --color-primary: #B84C4C;
      --color-primary-dark: #7D3232;
      --color-primary-light: #D48383;
      --color-accent: #D4A017;
      --card-bg: rgba(255,255,255,0.96);
      --text-primary: #333;
      --text-secondary: #666;
      --text-muted: #999;
      --input-bg: #fdf8f8;
      --input-border: #edd0d0;
      --input-focus: #B84C4C;
      --btn-gradient-from: #B84C4C;
      --btn-gradient-to: #8B3A3A;
      --btn-shadow: rgba(139,58,58,0.3);
      --bar-gradient-from: #D48383;
      --bar-gradient-to: #B84C4C;
      --bar-gradient-end: #7D3232;
      --result-avatar-bg: linear-gradient(135deg, #fce8e8, #f5d0d0);
      --result-name-accent: #B84C4C;
      --growth-bg: #fdf8f8;
      --growth-value: #B84C4C;
      --divider-color: #f5e8e8;
      --like-count-color: #B84C4C;
      --heart-filled: '💜';
      --multi-item-bg: #fdf8f8;
      --multi-item-hover: #fce8e8;
      --theme-name: '红';
    }
    [data-theme="blue"] {
      --color-bg-from: #1A3A6B;
      --color-bg-to: #2563A0;
      --color-primary: #3D7DCA;
      --color-primary-dark: #285A99;
      --color-primary-light: #6BA3D9;
      --color-accent: #F0C050;
      --input-bg: #f6f9fd;
      --input-border: #d0dff0;
      --input-focus: #3D7DCA;
      --btn-gradient-from: #3D7DCA;
      --btn-gradient-to: #285A99;
      --btn-shadow: rgba(40,90,153,0.3);
      --bar-gradient-from: #6BA3D9;
      --bar-gradient-to: #3D7DCA;
      --bar-gradient-end: #285A99;
      --result-avatar-bg: linear-gradient(135deg, #e8f0fc, #d0e0f5);
      --result-name-accent: #3D7DCA;
      --growth-bg: #f6f9fd;
      --growth-value: #3D7DCA;
      --divider-color: #e8eef5;
      --like-count-color: #3D7DCA;
      --heart-filled: '💙';
      --multi-item-bg: #f6f9fd;
      --multi-item-hover: #e8f0fc;
      --theme-name: '蓝';
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--color-bg-from) 0%, var(--color-bg-to) 50%, var(--color-bg-from) 100%);
      background-attachment: fixed;
      color: #333;
      transition: background 0.4s ease;
    }

    /* 背景装饰 */
    .bg-decoration {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .bg-decoration .bubble {
      position: absolute; border-radius: 50%; opacity: 0.06;
      animation: float-up linear infinite;
      background: white;
    }
    @keyframes float-up {
      0% { transform: translateY(110vh) scale(0); }
      10% { opacity: 0.07; }
      90% { opacity: 0.07; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* 顶部主题切换栏 */
    .top-bar {
      position: relative; z-index: 10;
      display: flex; justify-content: flex-end;
      max-width: 480px; margin: 0 auto; padding: 16px 20px 0;
    }
    .theme-toggle {
      display: flex; align-items: center;
      width: 52px; height: 28px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer; position: relative;
      transition: background 0.3s, border-color 0.3s;
      box-shadow: 0 0 10px rgba(0,0,0,0.15), inset 0 1px 2px rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: rgba(255,255,255,0.55); }
    .theme-toggle .knob {
      position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: white;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    [data-theme="blue"] .theme-toggle .knob {
      transform: translateX(24px);
    }

    .container {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto; padding: 0 20px 40px;
    }

    /* 头部 */
    .header {
      text-align: center; margin-bottom: 28px;
    }
    .header .logo {
      font-size: 52px; margin-bottom: 4px;
      animation: bounce 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .header h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(to right, #fff, rgba(255,255,255,0.8));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 2px; }

    /* 搜索卡片 */
    .search-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border-radius: 20px; padding: 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
      margin-bottom: 18px;
    }
    .search-label {
      font-size: 15px; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .search-row {
      display: flex; gap: 10px;
    }
    .search-row input {
      flex: 1; padding: 13px 16px;
      border: 2px solid var(--input-border); border-radius: 14px;
      font-size: 16px; outline: none; transition: border-color 0.2s;
      background: var(--input-bg); color: var(--text-primary);
    }
    .search-row input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--input-focus) 12%, transparent);
    }
    .search-row input::placeholder { color: #c0b8b8; }
    .search-row button {
      padding: 13px 24px;
      background: linear-gradient(135deg, var(--btn-gradient-from), var(--btn-gradient-to));
      color: white; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px var(--btn-shadow);
      white-space: nowrap;
    }
    .search-row button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--btn-shadow); }
    .search-row button:active { transform: translateY(0); }
    .search-row button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg {
      color: #ef4444; font-size: 13px; margin-top: 10px; display: none;
      background: #fef2f2; padding: 8px 12px; border-radius: 8px;
    }
    .hint {
      color: var(--text-muted); font-size: 12px; margin-top: 12px; text-align: center;
    }
    .data-info {
      font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 6px;
    }

    /* 结果卡片 */
    .result-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border-radius: 20px; padding: 28px 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
      display: none; overflow: hidden;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
    }
    .result-avatar {
      width: 80px; height: 80px; border-radius: 20px;
      background: var(--result-avatar-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; box-shadow: 0 8px 20px color-mix(in srgb, var(--color-primary) 18%, transparent);
      flex-shrink: 0;
    }
    .result-avatar img {
      width: 100%; height: 100%; object-fit: contain; border-radius: 20px;
    }
    .result-info h3 {
      font-size: 22px; font-weight: 700; color: var(--text-primary);
    }
    .result-info .pet-name {
      font-size: 14px; color: var(--result-name-accent); font-weight: 600; margin-top: 2px;
    }
    .result-info .stage-badge {
      display: inline-block; margin-top: 6px; padding: 4px 14px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .stage-egg { background: #fef3c7; color: #d97706; }
    .stage-baby { background: #d1fae5; color: #059669; }
    .stage-teen { background: #dbeafe; color: #2563eb; }
    .stage-adult { background: #ede9fe; color: #7c3aed; }

    /* 经验条 */
    .exp-section { margin-bottom: 18px; }
    .exp-label {
      display: flex; justify-content: space-between; font-size: 13px;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .exp-label span:last-child { font-weight: 600; color: var(--result-name-accent); }
    .exp-bar-wrap {
      height: 14px; background: var(--divider-color); border-radius: 10px; overflow: hidden;
    }
    .exp-bar-fill {
      height: 100%; border-radius: 10px;
      background: linear-gradient(90deg, var(--bar-gradient-from), var(--bar-gradient-to), var(--bar-gradient-end));
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .exp-bar-fill::after {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0;
      width: 30px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    }

    /* 成长信息 */
    .growth-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px;
    }
    .growth-item {
      background: var(--growth-bg); border-radius: 14px; padding: 14px; text-align: center;
    }
    .growth-item .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .growth-item .value { font-size: 22px; font-weight: 700; color: var(--growth-value); }
    .growth-item .sub { font-size: 12px; color: #aaa; margin-top: 2px; }

    /* 宠物属性 */
    .type-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600; margin-top: 4px;
    }
    .type-grass { background: #d1fae5; color: #059669; }
    .type-fire { background: #fee2e2; color: #dc2626; }
    .type-water { background: #dbeafe; color: #2563eb; }
    .type-bug { background: #ecfccb; color: #65a30d; }
    .type-flying { background: #ede9fe; color: #7c3aed; }
    .type-normal { background: #f5f5f4; color: #78716c; }
    .type-electric { background: #fef9c3; color: #ca8a04; }
    .type-ice { background: #e0f2fe; color: #0284c7; }
    .type-fighting { background: #fee2e2; color: #991b1b; }
    .type-ghost { background: #ede9fe; color: #6d28d9; }
    .type-rock { background: #fef3c7; color: #92400e; }
    .type-dragon { background: #fce7f3; color: #be185d; }
    .type-dark { background: #e5e5e5; color: #444; }
    .type-poison { background: #f3e8ff; color: #7c3aed; }
    .type-ground { background: #fef3c7; color: #92400e; }
    .type-steel { background: #f1f5f9; color: #64748b; }
    .type-fairy { background: #fce7f3; color: #be185d; }
    .type-psychic { background: #fce7f3; color: #be185d; }

    .pet-pokemon-type {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 10px;
      font-size: 12px; font-weight: 600;
    }

    /* 点赞区域 */
    .like-section {
      text-align: center; padding-top: 16px;
      border-top: 1px solid var(--divider-color);
    }
    .like-btn {
      display: inline-flex; flex-direction: column; align-items: center;
      gap: 6px; cursor: pointer; user-select: none;
      transition: transform 0.15s;
    }
    .like-btn:hover { transform: scale(1.05); }
    .like-btn:active { transform: scale(0.95); }
    .like-btn .heart-icon {
      font-size: 48px; transition: transform 0.3s;
    }
    .like-btn.pulse .heart-icon {
      animation: heartPulse 0.4s ease-out;
    }
    @keyframes heartPulse {
      0% { transform: scale(1); }
      30% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .like-count {
      font-size: 15px; font-weight: 700; color: var(--like-count-color);
    }
    .like-label { font-size: 12px; color: #aaa; }

    /* 浮动emoji */
    .floating-emoji {
      position: fixed; font-size: 28px; pointer-events: none;
      animation: emojiRise 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 100;
    }
    @keyframes emojiRise {
      0% { transform: translateY(0) translateX(0) scale(0.3) rotate(0deg); opacity: 1; }
      30% { transform: translateY(-40px) translateX(var(--dx)) scale(1.1) rotate(10deg); opacity: 1; }
      100% { transform: translateY(-300px) translateX(var(--dx2)) scale(0.2) rotate(var(--rot)); opacity: 0; }
    }

    /* 多结果列表 */
    .multi-results { margin-top: 12px; }
    .multi-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border-radius: 12px; background: var(--multi-item-bg); margin-bottom: 8px;
      cursor: pointer; transition: background 0.2s;
    }
    .multi-item:hover { background: var(--multi-item-hover); }
    .multi-item .mini-avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--result-avatar-bg);
      display: flex; align-items: center;
      justify-content: center; font-size: 24px; flex-shrink: 0;
    }
    .multi-item .mini-avatar img {
      width: 100%; height: 100%; object-fit: contain; border-radius: 12px;
    }
    .multi-item .mini-info h4 { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .multi-item .mini-info span { font-size: 12px; color: var(--text-muted); }

    /* 返回按钮 */
    .back-home {
      display: block; text-align: center; margin-top: 16px;
      color: rgba(255,255,255,0.7); font-size: 13px; text-decoration: none;
      transition: color 0.2s;
    }
    .back-home:hover { color: white; }

    /* 响应式 */
    @media (max-width: 400px) {
      .container, .top-bar { padding-left: 14px; padding-right: 14px; }
      .result-card, .search-card { padding: 20px 16px; }
      .result-avatar { width: 60px; height: 60px; font-size: 32px; }
      .growth-grid { grid-template-columns: 1fr; }
      .search-row { gap: 8px; }
      .search-row button { padding: 13px 18px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="bg-decoration" id="bgDeco"></div>

<div class="top-bar">
  <button class="theme-toggle" id="themeToggle" title="切换主题">
    <span class="knob">🔴</span>
  </button>
</div>

<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="logo">🐾</div>
    <h1>我的宠物</h1>
    <p>输入你的名字，看看宠物成长得怎么样了~</p>
  </div>

  <!-- 搜索卡片 -->
  <div class="search-card">
    <div class="search-label">🔍 输入姓名</div>
    <div class="search-row">
      <input type="text" id="nameInput" placeholder="请输入你的姓名..." autocomplete="off" />
      <button id="searchBtn">查询</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="data-info" id="dataInfo"></div>
    <div class="hint">💡 提示：使用全名准确查找，支持模糊匹配</div>
  </div>

  <!-- 结果卡片 -->
  <div class="result-card" id="resultCard">
    <div class="result-header" id="resultHeader"></div>
    <div class="exp-section" id="expSection"></div>
    <div class="growth-grid" id="growthGrid"></div>
    <div class="like-section" id="likeSection"></div>
  </div>

  <a class="back-home" href="./">← 返回主页</a>
</div>

<script>
// ============ 主题管理 ============
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem('pokemon-theme'); } catch(e) {}
  var theme = (saved === 'blue') ? 'blue' : 'red';
  document.documentElement.setAttribute('data-theme', theme);
  updateToggleKnob(theme);
})();

function updateToggleKnob(theme) {
  var knob = document.querySelector('.theme-toggle .knob');
  if (knob) knob.textContent = theme === 'blue' ? '🔵' : '🔴';
}

document.getElementById('themeToggle').addEventListener('click', function() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'blue' ? 'red' : 'blue';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('pokemon-theme', next); } catch(e) {}
  updateToggleKnob(next);
});

// ============ 内嵌宠物数据 ============
var PET_TYPES = [
  {id:'bulbasaur',name:'妙蛙种子',color:'#4CAF50',emoji:'🌱',pokemonType:'grass',stages:{egg:'草属性蛋',baby:'妙蛙种子',teen:'妙蛙草',adult:'妙蛙花'}},
  {id:'charmander',name:'小火龙',color:'#FF5722',emoji:'🔥',pokemonType:'fire',stages:{egg:'火属性蛋',baby:'小火龙',teen:'火恐龙',adult:'喷火龙'}},
  {id:'squirtle',name:'杰尼龟',color:'#2196F3',emoji:'💧',pokemonType:'water',stages:{egg:'水属性蛋',baby:'杰尼龟',teen:'卡咪龟',adult:'水箭龟'}},
  {id:'caterpie',name:'绿毛虫',color:'#8BC34A',emoji:'🐛',pokemonType:'bug',stages:{egg:'虫属性蛋',baby:'绿毛虫',teen:'铁甲蛹',adult:'巴大蝶'}},
  {id:'pidgey',name:'波波',color:'#9C27B0',emoji:'🐦',pokemonType:'flying',stages:{egg:'飞行属性蛋',baby:'波波',teen:'比比鸟',adult:'大比鸟'}},
  {id:'chikorita',name:'菊草叶',color:'#66BB6A',emoji:'🌿',pokemonType:'grass',stages:{egg:'草属性蛋',baby:'菊草叶',teen:'月桂叶',adult:'大竺葵'}},
  {id:'cyndaquil',name:'火球鼠',color:'#FF7043',emoji:'🔥',pokemonType:'fire',stages:{egg:'火属性蛋',baby:'火球鼠',teen:'火岩鼠',adult:'火暴兽'}},
  {id:'torchic',name:'火稚鸡',color:'#FF9800',emoji:'🐔',pokemonType:'fire',stages:{egg:'火属性蛋',baby:'火稚鸡',teen:'力壮鸡',adult:'火焰鸡'}},
  {id:'mudkip',name:'水跃鱼',color:'#039BE5',emoji:'🐟',pokemonType:'water',stages:{egg:'水属性蛋',baby:'水跃鱼',teen:'沼跃鱼',adult:'巨沼怪'}},
  {id:'sprigatito',name:'新叶喵',color:'#FF9800',emoji:'🐱',pokemonType:'grass',stages:{egg:'草属性蛋',baby:'新叶喵',teen:'魔幻假面喵',adult:'炽焰咆哮虎'}}
];

var STAGE_CONFIG = {
  egg:   { name:'蛋',   minExp:0,   label:'🥚 蛋',   emoji:'🥚', nextExp:100 },
  baby:  { name:'幼年体', minExp:100, label:'🐣 幼年体', emoji:'🐣', nextExp:300 },
  teen:  { name:'成长体', minExp:300, label:'⭐ 成长体', emoji:'⭐', nextExp:600 },
  adult: { name:'完全体', minExp:600, label:'👑 完全体', emoji:'👑', nextExp:null }
};

function getStageByExperience(exp) {
  if (exp >= 600) return 'adult';
  if (exp >= 300) return 'teen';
  if (exp >= 100) return 'baby';
  return 'egg';
}

function getNextStageExp(exp) {
  if (exp < 100) return 100;
  if (exp < 300) return 300;
  if (exp < 600) return 600;
  return null;
}

function findPetType(petTypeId, customPets) {
  var builtin = PET_TYPES.find(function(p) { return p.id === petTypeId; });
  if (builtin) return builtin;
  if (customPets && customPets.length) {
    return customPets.find(function(p) { return p.id === petTypeId; }) || null;
  }
  return null;
}

function getPetImage(petType, stage) {
  if (!petType) return '🐾';
  if (stage === 'egg') {
    return '<img src="./pokemon/egg_' + petType.pokemonType + '.svg" alt="蛋" onerror="this.style.display=\'none\';this.parentElement.textContent=\'🥚\'" />';
  }
  if (petType.isCustom && petType.customImages && petType.customImages[stage]) {
    return '<img src="' + petType.customImages[stage] + '" alt="' + stage + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (petType.emoji || '🐾') + '\'" />';
  }
  return '<img src="./pokemon/' + petType.id + '_' + stage + '.png" alt="' + stage + '" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (petType.emoji || '🐾') + '\'" />';
}

// ============ DOM 元素 ============
var nameInput = document.getElementById('nameInput');
var searchBtn = document.getElementById('searchBtn');
var errorMsg = document.getElementById('errorMsg');
var dataInfo = document.getElementById('dataInfo');
var resultCard = document.getElementById('resultCard');
var resultHeader = document.getElementById('resultHeader');
var expSection = document.getElementById('expSection');
var growthGrid = document.getElementById('growthGrid');
var likeSection = document.getElementById('likeSection');

// ============ 数据状态 ============
var allStudents = [];
var customPets = [];
var dataLoaded = false;

// 优先从服务器 JSON 加载，失败降级到 localStorage
function loadData(callback) {
  fetch('./data/students.json?' + Date.now())
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      allStudents = data.students || [];
      customPets = data.customPets || [];
      dataLoaded = true;
      updateDataInfo();
      console.log('📡 从服务器加载了 ' + allStudents.length + ' 名学生' + (customPets.length ? '，' + customPets.length + ' 只自定义宠物' : ''));
      callback();
    })
    .catch(function(err) {
      console.warn('⚠️ 服务器数据加载失败:', err.message, '，尝试本地存储...');
      tryLocalStorage(callback);
    });
}

function tryLocalStorage(callback) {
  try {
    var data = localStorage.getItem('pet-learning-system-data');
    allStudents = data ? JSON.parse(data) : [];
  } catch(e) { allStudents = []; }
  try {
    var cp = localStorage.getItem('pet-learning-system-custom-pets');
    customPets = cp ? JSON.parse(cp) : [];
  } catch(e) { customPets = []; }
  dataLoaded = true;
  updateDataInfo();
  console.log('💾 从本地存储加载了 ' + allStudents.length + ' 名学生');
  callback();
}

function updateDataInfo() {
  if (allStudents.length > 0) {
    dataInfo.textContent = '📊 当前共 ' + allStudents.length + ' 名学生';
    dataInfo.style.display = 'block';
  } else {
    dataInfo.textContent = '';
    dataInfo.style.display = 'none';
  }
}

// ============ 点赞 ============
var LIKE_KEY_PREFIX = 'pet-query-likes-';
var EMOJIS = ['❤️','💖','💕','💝','🎁','🎈','🎀','🌟','✨','💫','🧸','🎮','🎯','🏆','💎','🌸','🌺','🍀','🎪','🦋','🐣','🌈','💐','🍬','🎨'];

function getLikeCount(studentId) {
  try { return parseInt(localStorage.getItem(LIKE_KEY_PREFIX + studentId) || '0'); }
  catch(e) { return 0; }
}

function addLike(studentId) {
  var count = getLikeCount(studentId) + 1;
  try { localStorage.setItem(LIKE_KEY_PREFIX + studentId, count.toString()); } catch(e) {}
  return count;
}

function spawnFloatingEmojis(btnRect) {
  var centerX = btnRect.left + btnRect.width / 2;
  var centerY = btnRect.top;
  var count = 5 + Math.floor(Math.random() * 6);
  for (var i = 0; i < count; i++) {
    (function(index) {
      setTimeout(function() {
        var emoji = document.createElement('span');
        emoji.className = 'floating-emoji';
        emoji.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        emoji.style.left = (centerX + (Math.random() - 0.5) * 200) + 'px';
        emoji.style.top = centerY + 'px';
        emoji.style.setProperty('--dx', ((Math.random() - 0.5) * 120) + 'px');
        emoji.style.setProperty('--dx2', ((Math.random() - 0.5) * 160) + 'px');
        emoji.style.setProperty('--rot', ((Math.random() - 0.5) * 60) + 'deg');
        emoji.style.animationDuration = (2 + Math.random() * 2) + 's';
        emoji.style.fontSize = (20 + Math.random() * 20) + 'px';
        document.body.appendChild(emoji);
        setTimeout(function() { emoji.remove(); }, 3000);
      }, index * 50);
    })(i);
  }
}

// ============ 显示结果 ============
function showResult(student) {
  var pet = student.pet;
  if (!pet) {
    errorMsg.textContent = '该学生还没有宠物数据';
    errorMsg.style.display = 'block';
    return;
  }

  var petType = findPetType(pet.petTypeId, customPets);
  var stage = getStageByExperience(pet.experience);
  var nextExp = getNextStageExp(pet.experience);
  var stageConfig = STAGE_CONFIG[stage];
  var currentStageExp = pet.experience - stageConfig.minExp;
  var stageRange = (nextExp || 600) - stageConfig.minExp;
  var progress = Math.min(100, Math.max(0, (currentStageExp / stageRange) * 100));

  // Header
  var avatarHtml = getPetImage(petType, stage);
  resultHeader.innerHTML =
    '<div class="result-avatar">' + avatarHtml + '</div>' +
    '<div class="result-info">' +
      '<h3>' + escapeHtml(student.name) + '</h3>' +
      '<div class="pet-name">' + (petType ? petType.emoji + ' ' + (petType.isCustom ? '✨ ' : '') + petType.name : '未知宠物') + '</div>' +
      '<div class="stage-badge stage-' + stage + '">' + stageConfig.label + '</div>' +
      (petType ? '<div class="pet-pokemon-type type-' + petType.pokemonType + '">' + petType.pokemonType + '</div>' : '') +
    '</div>';

  // 经验条
  var stageName = petType && petType.stages ? (petType.stages[stage] || stageConfig.name) : stageConfig.name;
  expSection.innerHTML =
    '<div class="exp-label"><span>经验值</span><span>' + pet.experience + ' / ' + (nextExp || 600) + '</span></div>' +
    '<div class="exp-bar-wrap"><div class="exp-bar-fill" style="width: ' + progress + '%"></div></div>' +
    '<div class="exp-label" style="margin-top:6px;"><span>当前阶段：' + stageName + '</span>' +
    '<span>' + (nextExp ? '距离下一阶段还需 ' + (nextExp - pet.experience) + ' 经验' : '🎉 已达满级！') + '</span></div>';

  // 成长信息
  growthGrid.innerHTML =
    '<div class="growth-item"><div class="label">🐾 宠物类型</div><div class="value" style="font-size:16px;">' + (petType ? petType.emoji + ' ' + petType.name : '❓') + '</div></div>' +
    '<div class="growth-item"><div class="label">📊 成长阶段</div><div class="value">' + (stageConfig.emoji || '🐾') + '</div><div class="sub">' + stageName + '</div></div>' +
    '<div class="growth-item"><div class="label">⭐ 当前经验</div><div class="value">' + pet.experience + '</div></div>' +
    '<div class="growth-item"><div class="label">🏆 排名</div><div class="value">' + getRank(student.id) + '</div><div class="sub">共 ' + allStudents.length + ' 名</div></div>';

  // 点赞
  renderLikeSection(student.id);

  resultCard.style.display = 'block';
  resultCard.style.animation = 'none';
  resultCard.offsetHeight;
  resultCard.style.animation = 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
}

function renderLikeSection(studentId) {
  var likeCount = getLikeCount(studentId);
  likeSection.innerHTML =
    '<div class="like-btn" id="likeBtn" data-student-id="' + studentId + '">' +
      '<span class="heart-icon">' + (likeCount > 0 ? '\uD83D\uDC9C' : '\uD83E\uDD0D') + '</span>' +
      '<span class="like-count">' + likeCount + ' 次点赞</span>' +
      '<span class="like-label">点击送爱心 ❤️</span>' +
    '</div>';

  setTimeout(function() {
    var btn = document.getElementById('likeBtn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      var newCount = addLike(studentId);
      btn.classList.add('pulse');
      setTimeout(function() { btn.classList.remove('pulse'); }, 400);
      btn.querySelector('.heart-icon').textContent = '\uD83D\uDC9C';
      btn.querySelector('.like-count').textContent = newCount + ' 次点赞';
      spawnFloatingEmojis(btn.getBoundingClientRect());
    });
  }, 50);
}

function getRank(studentId) {
  var targetExp = null;
  for (var i = 0; i < allStudents.length; i++) {
    if (allStudents[i].id === studentId) {
      targetExp = allStudents[i].pet.experience;
      break;
    }
  }
  if (targetExp === null) return 'N/A';

  var higherCount = 0;
  for (var j = 0; j < allStudents.length; j++) {
    if (allStudents[j].pet.experience > targetExp) higherCount++;
  }
  var rank = higherCount + 1;
  if (rank === 1) return '\uD83E\uDD471st';
  if (rank === 2) return '\uD83E\uDD482nd';
  if (rank === 3) return '\uD83E\uDD493rd';
  return '第' + rank + '名';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ 搜索 ============
function doSearch() {
  var query = nameInput.value.trim();
  errorMsg.style.display = 'none';
  resultCard.style.display = 'none';

  if (!query) {
    showError('请输入姓名');
    return;
  }

  if (!dataLoaded) {
    showError('数据加载中，请稍后再试...');
    return;
  }

  if (allStudents.length === 0) {
    showError('暂无学生数据，请先在系统中添加学生');
    return;
  }

  // 精确匹配
  var exactMatches = [];
  for (var i = 0; i < allStudents.length; i++) {
    if (allStudents[i].name === query) {
      exactMatches.push(allStudents[i]);
    }
  }
  if (exactMatches.length === 1) {
    showResult(exactMatches[0]);
    return;
  }
  if (exactMatches.length > 1) {
    showMultiResults(exactMatches);
    return;
  }

  // 模糊匹配
  var fuzzyMatches = [];
  for (var j = 0; j < allStudents.length; j++) {
    if (allStudents[j].name.indexOf(query) !== -1) {
      fuzzyMatches.push(allStudents[j]);
    }
  }

  if (fuzzyMatches.length === 0) {
    showError('未找到名为「' + query + '」的学生，请检查姓名是否正确');
    return;
  }

  if (fuzzyMatches.length === 1) {
    showResult(fuzzyMatches[0]);
  } else {
    showMultiResults(fuzzyMatches);
  }
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}

function showMultiResults(matches) {
  resultHeader.innerHTML = '<div style="font-size:15px;font-weight:600;color:var(--text-secondary);">找到 ' + matches.length + ' 个匹配的学生：</div>';
  expSection.innerHTML = '';
  growthGrid.innerHTML = '';
  likeSection.innerHTML = '';

  var listHtml = '<div class="multi-results">';
  for (var i = 0; i < matches.length; i++) {
    var s = matches[i];
    var petType = findPetType(s.pet.petTypeId, customPets);
    var stage = getStageByExperience(s.pet.experience);
    var avatarHtml = getPetImage(petType, stage);
    listHtml +=
      '<div class="multi-item" data-student-id="' + s.id + '" onclick="selectStudent(\'' + s.id + '\')">' +
        '<div class="mini-avatar">' + avatarHtml + '</div>' +
        '<div class="mini-info">' +
          '<h4>' + escapeHtml(s.name) + '</h4>' +
          '<span>' + (petType ? petType.emoji + ' ' + petType.name : '未知') + ' · ' + STAGE_CONFIG[stage].label + ' · ' + s.pet.experience + '经验</span>' +
        '</div>' +
      '</div>';
  }
  listHtml += '</div>';
  expSection.innerHTML = listHtml;

  resultCard.style.display = 'block';
  resultCard.style.animation = 'none';
  resultCard.offsetHeight;
  resultCard.style.animation = 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
}

window.selectStudent = function(studentId) {
  for (var i = 0; i < allStudents.length; i++) {
    if (allStudents[i].id === studentId) {
      showResult(allStudents[i]);
      return;
    }
  }
};

// ============ 事件绑定 ============
searchBtn.addEventListener('click', doSearch);
nameInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

// ============ 背景装饰 ============
function initBgDecoration() {
  var bg = document.getElementById('bgDeco');
  for (var i = 0; i < 10; i++) {
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var size = 40 + Math.random() * 100;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = (Math.random() * 100) + '%';
    bubble.style.animationDuration = (14 + Math.random() * 18) + 's';
    bubble.style.animationDelay = (Math.random() * 14) + 's';
    bg.appendChild(bubble);
  }
}

// ============ 初始化 ============
initBgDecoration();

loadData(function() {
  // URL name 参数自动查询
  var urlParams = new URLSearchParams(window.location.search);
  var nameParam = urlParams.get('name');
  if (nameParam) {
    nameInput.value = nameParam;
    doSearch();
  }
});
</script>
</body>
</html>
